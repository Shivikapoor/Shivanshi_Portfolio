<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0B0E14" />

    <script>
      // Applies the saved/system theme before first paint to avoid a
      // flash of the wrong theme. ThemeContext (src/context/ThemeContext.jsx)
      // takes over from here once React mounts.
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          /* localStorage or matchMedia unavailable — default to dark */
        }
      })();
    </script>

    <title>Shivanshi Kapoor | Full-Stack Developer</title>
